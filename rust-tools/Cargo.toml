[package]
name = "factorio-constraint-builder"
version = "0.1.0"
edition = "2021"
authors = ["Your Name"]
description = "Constraint-based factory builder for Factorio"
license = "MIT"

[[bin]]
name = "fcb-repl"
path = "src/bin/repl.rs"

[[bin]]
name = "fcb-solver"
path = "src/bin/solver.rs"

[dependencies]
# RCON client
rcon = { version = "0.6", features = ["rt-tokio"] }
tokio = { version = "1", features = ["full"] }

# DSL parsing
nom = "7"

# REPL
rustyline = "14"
dirs = "5"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
anyhow = "1"
thiserror = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# CLI
clap = { version = "4", features = ["derive", "env"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
